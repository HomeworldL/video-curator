[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-curator"
version = "0.1.0"
description = "Topic-driven multi-platform discovery and screening of original videos"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "httpx>=0.28,<1",
    "Pillow>=10,<13",
    "yt-dlp>=2026.10.14",
    "ddgs>=9,<10",
]

[project.scripts]
video-curator = "video_curator.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
